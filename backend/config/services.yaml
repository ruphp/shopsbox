# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    file_storage.local_root: '%kernel.project_dir%/%env(FILE_STORAGE_LOCAL_PATH)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    App\Tenant\Application\Contracts\TenantRepository: '@App\Tenant\Infrastructure\Persistence\Doctrine\Repository\DoctrineTenantRepository'
    App\Tenant\Application\Contracts\StoreRepository: '@App\Tenant\Infrastructure\Persistence\Doctrine\Repository\DoctrineStoreRepository'
    App\Tenant\Application\Contracts\AuthCodeRepository: '@App\Tenant\Infrastructure\Persistence\Doctrine\Repository\DoctrineAuthCodeRepository'
    App\Tenant\Application\Contracts\AuthCodeDelivery: '@App\Tenant\Infrastructure\Adapters\DevFileAuthCodeDelivery'
    App\Tenant\Application\Contracts\EntityFlusher: '@App\Tenant\Infrastructure\Adapters\DoctrineEntityFlusher'
    App\Tenant\Application\Contracts\UuidGenerator: '@App\Tenant\Infrastructure\Adapters\SymfonyUuidGenerator'
    App\Catalog\Application\Contracts\CategoryRepository: '@App\Catalog\Infrastructure\Persistence\Doctrine\Repository\DoctrineCategoryRepository'
    App\Catalog\Application\Contracts\ProductRepository: '@App\Catalog\Infrastructure\Persistence\Doctrine\Repository\DoctrineProductRepository'
    App\Catalog\Application\Contracts\ProductImageRepository: '@App\Catalog\Infrastructure\Persistence\Doctrine\Repository\DoctrineProductImageRepository'
    App\Catalog\Application\Contracts\EntityFlusher: '@App\Catalog\Infrastructure\Adapters\DoctrineEntityFlusher'
    App\Catalog\Application\Contracts\UuidGenerator: '@App\Catalog\Infrastructure\Adapters\SymfonyUuidGenerator'
    App\Storefront\Application\Contracts\StorefrontStoreRepository: '@App\Storefront\Infrastructure\Persistence\Doctrine\Repository\DoctrineStorefrontStoreRepository'
    App\Storefront\Application\Contracts\StorefrontProductRepository: '@App\Storefront\Infrastructure\Persistence\Doctrine\Repository\DoctrineStorefrontProductRepository'
    App\FileStorage\Application\Contracts\FileStorage: '@App\FileStorage\Infrastructure\Storage\FlysystemFileStorage'
    App\FileStorage\Application\Contracts\FileUrlBuilder: '@App\FileStorage\Infrastructure\Url\ConfiguredFileUrlBuilder'
    App\Moderation\Application\Contracts\ModerationQueueRepository: '@App\Moderation\Infrastructure\Persistence\Doctrine\Repository\DoctrineModerationQueueRepository'
    App\Moderation\Application\Contracts\EntityFlusher: '@App\Moderation\Infrastructure\Adapters\DoctrineEntityFlusher'
    League\Flysystem\FilesystemOperator:
        factory: ['@App\FileStorage\Infrastructure\Storage\FlysystemFactory', 'create']

    App\FileStorage\Infrastructure\Storage\FlysystemFactory:
        arguments:
            $adapter: '%env(FILE_STORAGE_ADAPTER)%'
            $localRoot: '%file_storage.local_root%'
            $s3Endpoint: '%env(S3_ENDPOINT)%'
            $s3Bucket: '%env(S3_BUCKET)%'
            $s3AccessKey: '%env(S3_ACCESS_KEY)%'
            $s3SecretKey: '%env(S3_SECRET_KEY)%'
            $s3Region: '%env(S3_REGION)%'
            $s3PathStyle: '%env(bool:S3_PATH_STYLE)%'

    App\FileStorage\Infrastructure\Url\ConfiguredFileUrlBuilder:
        arguments:
            $publicBaseUrl: '%env(FILE_STORAGE_PUBLIC_BASE_URL)%'

    App\Tenant\Infrastructure\Adapters\DevFileAuthCodeDelivery:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $requestStack: '@request_stack'
